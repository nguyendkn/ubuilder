[package]
name = "tauri_fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri_fixture"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
