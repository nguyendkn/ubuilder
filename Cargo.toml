[package]
name = "ubuilder"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Universal Desktop Builder - cross-platform build and packaging engine for desktop applications"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/universal-builder"
default-run = "ubuilder"

[lib]
name = "ubuilder"
path = "src/lib.rs"

[[bin]]
name = "ubuilder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal", "fs"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
which = "7"
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
json5 = "0.4"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"
glob = "0.3"
rpassword = "7.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "pipeline"
harness = false

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "warn"
